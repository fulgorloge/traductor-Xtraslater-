<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      background: #09090b;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 14px;
      margin: 0;
    }
    h3 {
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .history-list {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
    }
    .history-orig { color: #a1a1aa; margin-bottom: 2px; }
    .history-trans { color: #3b82f6; font-weight: 600; }
    .empty { color: #71717a; font-size: 12px; text-align: center; padding: 10px 0; }
    button.clear-btn {
      width: 100%;
      margin-top: 10px;
      background: #27272a;
      color: #f4f4f5;
      border: none;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
    button.clear-btn:hover { background: #3f3f46; }
  </style>
</head>
<body>
  <h3>🌐 Historial Reciente</h3>
  <div id="historyContainer" class="history-list"></div>
  <button id="clearBtn" class="clear-btn">Limpiar Historial</button>

  <script>
    const container = document.getElementById('historyContainer');
    const clearBtn = document.getElementById('clearBtn');

    function loadHistory() {
      chrome.storage.local.get({ history: [] }, (res) => {
        if (res.history.length === 0) {
          container.innerHTML = '<div class="empty">Sin traducciones recientes</div>';
          return;
        }
        container.innerHTML = res.history.map(item => `
          <div class="history-item">
            <div class="history-orig">${escapeHtml(item.original)}</div>
            <div class="history-trans">${escapeHtml(item.translated)}</div>
          </div>
        `).join('');
      });
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    clearBtn.addEventListener('click', () => {
      chrome.storage.local.set({ history: [] }, loadHistory);
    });

    loadHistory();
  </script>
</body>
</html>
