
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Xtranslater</title>
  <style>
    body {
      width: 320px;
      font-family: Arial, sans-serif;
      padding: 12px;
      margin: 0;
      box-sizing: border-box;
      background-color: #f9f9f9;
    }
    h3 {
      margin-top: 0;
      color: #333;
      font-size: 16px;
    }
    .field-group {
      margin-bottom: 10px;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      color: #555;
      display: block;
      margin-bottom: 4px;
    }
    select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px;
      font-size: 13px;
    }
    textarea {
      height: 70px;
      resize: vertical;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0056b3;
    }
    button.secondary {
      background-color: #6c757d;
    }
    button.secondary:hover {
      background-color: #5a6268;
    }
    #resultText {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      min-height: 50px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 13px;
      color: #222;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h3>Xtranslater</h3>
  
  <div class="field-group">
    <label for="engine">Motor de traducción:</label>
    <select id="engine">
      <option value="google">Google Translate</option>
      <option value="mymemory">MyMemory</option>
    </select>
  </div>

  <div class="field-group">
    <label for="targetLang">Idioma de destino:</label>
    <select id="targetLang">
      <option value="es">Español</option>
      <option value="en">Inglés</option>
      <option value="fr">Francés</option>
      <option value="de">Alemán</option>
      <option value="it">Italiano</option>
      <option value="pt">Portugués</option>
    </select>
  </div>

  <div class="field-group">
    <textarea id="sourceText" placeholder="Escribe o pega texto aquí..."></textarea>
  </div>

  <div class="btn-group">
    <button id="translateBtn">Traducir</button>
    <button id="ttsBtn" class="secondary">🔊 Escuchar</button>
  </div>

  <div class="field-group" style="margin-top: 12px;">
    <label>Traducción:</label>
    <div id="resultText">Esperando texto...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
